[project]
name = "breathing-cnn-tcn"
version = "0.1.0"
description = "CNN + TCN baseline for the breathing-from-video challenge"
requires-python = ">=3.11"
dependencies = [
    "scoring",                     # scoring metrics (workspace package)
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "torch>=2.6",
]

[tool.uv.sources]
scoring = { workspace = true }
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breathing_cnn_tcn"]

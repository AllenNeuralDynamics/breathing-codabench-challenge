[project]
name = "breathing-cnn-tcn"
dynamic = ["version"]
description = "CNN + TCN baseline for the breathing-from-video challenge"
requires-python = ">=3.11"
dependencies = [
    "scoring",                     # scoring metrics (workspace package)
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "marimo>=0.7",
]

[project.optional-dependencies]
train = ["torch>=2.6,<2.8"]

[tool.uv.sources]
scoring = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breathing_cnn_tcn"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

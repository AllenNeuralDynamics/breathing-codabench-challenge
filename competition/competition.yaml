# Codabench v2 competition bundle configuration
# Docs: https://docs.codabench.org/latest/
title: Breathing from Video Challenge
description: Infer breathing signals from short video snippets of mice.
registration_auto_approve: true
enable_detailed_results: true

# Phases define the competition timeline and submission rules.
# Adjust dates before upload.
phases:
  - index: 0
    name: Development
    description: >
      Train and validate on the public split. Leaderboard is scored against
      public ground truth.
    start: 2026-10-01
    end: 2026-11-30
    max_submissions_per_day: 5
    max_submissions: 100
    execution_time_limit: 600   # seconds
    tasks:
      - 0

  - index: 1
    name: Final Evaluation
    description: >
      Submit predictions on the private split. Ground truth is not released.
      Leaderboard is scored against private thermistor recordings.
    start: 2026-12-01
    end: 2026-12-31
    max_submissions_per_day: 3
    max_submissions: 10
    execution_time_limit: 600
    tasks:
      - 1

tasks:
  - index: 0
    name: Public scoring
    description: Score predictions against public-split ground truth.
    scoring_program: 0

  - index: 1
    name: Private scoring
    description: Score predictions against private-split ground truth.
    scoring_program: 0

scoring_programs:
  - index: 0
    name: breathing-scoring
    description: >
      Fetches ground-truth parquets from S3 and computes DTW, Pearson r,
      inhalation onset/offset MAE, and KL-IBI divergence.
    command: python /app/score.py $input $output
    # Image is built and pushed by .github/workflows/build-images.yml
    container_image: ghcr.io/allenneuraldynamics/breathing-codabench-challenge/scoring:latest

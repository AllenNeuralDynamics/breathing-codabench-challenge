[project]
name = "breathing-baseline"
version = "0.1.0"
description = "Baseline inference model and examples for the breathing-from-video challenge"
requires-python = ">=3.11"
dependencies = [
    "scoring",                     # scoring metrics (workspace package)
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[tool.uv.sources]
scoring = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breathing_baseline"]

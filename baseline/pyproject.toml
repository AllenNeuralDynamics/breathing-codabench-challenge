[project]
name = "breathing-baseline"
dynamic = ["version"]
description = "Scoring and submission adapters for the breathing-from-video challenge baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scoring",                     # scoring metrics (workspace package)
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "torch>=2.6,<2.8",
    "zephyr",
]

[tool.uv.sources]
scoring = { workspace = true }
zephyr = { path = "zephyr", editable = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseline"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install scoring program
        run: uv sync

      - name: Lint
        run: uv run ruff check .
